# P00 local development stack: PostgreSQL only (P00 spec §7).
# Credentials come from the git-ignored .env generated by scripts/bootstrap.ts;
# nothing secret is committed. The port is bound to loopback only.
name: harness-dev

services:
  postgres:
    image: postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_USER: ${HARNESS_DB_USER:?HARNESS_DB_USER is required (run scripts/bootstrap.ts)}
      POSTGRES_PASSWORD: ${HARNESS_DB_PASSWORD:?HARNESS_DB_PASSWORD is required (run scripts/bootstrap.ts)}
      POSTGRES_DB: ${HARNESS_DB_NAME:?HARNESS_DB_NAME is required (run scripts/bootstrap.ts)}
    ports:
      - "127.0.0.1:${HARNESS_DB_PORT:-55432}:5432"
    volumes:
      # PostgreSQL 18+ images keep versioned data dirs under /var/lib/postgresql.
      - harness-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    security_opt:
      - no-new-privileges:true

volumes:
  harness-pg:
